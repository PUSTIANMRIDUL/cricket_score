<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Match — Crease</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch-dark: #0B2B1F;
    --pitch-mid: #123726;
    --pitch-line: #1D4E37;
    --cream: #F2EDE1;
    --cream-dim: #C9C3B4;
    --ball-red: #A8291F;
    --ball-red-bright: #C7342A;
    --gold: #C9A227;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--pitch-dark);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }

  h1, h2, .digits { font-family: 'Teko', sans-serif; font-weight: 600; line-height: 1; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 43, 31, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--pitch-line);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 28px;
  }

  .topbar .logo {
    font-family: 'Teko', sans-serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--cream);
    text-decoration: none;
  }

  .topbar .logo .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ball-red-bright);
    display: inline-block;
  }

  nav.main-nav { display: flex; gap: 40px; }

  nav.main-nav a {
    font-size: 15px;
    font-weight: 500;
    color: var(--cream-dim);
    text-decoration: none;
    padding: 4px 0;
  }

  nav.main-nav a:hover { color: var(--cream); }

  .auth-group { display: flex; align-items: center; gap: 12px; }

  .btn-ghost-nav, .btn-solid-nav {
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 20px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn-ghost-nav { color: var(--cream); border-color: var(--pitch-line); background: transparent; }
  .btn-solid-nav { background: var(--ball-red-bright); color: var(--cream); }

  .nav-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--cream);
    font-size: 26px;
    cursor: pointer;
  }

  @media (max-width: 900px) {
    nav.main-nav, .auth-group { display: none; }
    .nav-toggle { display: block; }
  }

  body.nav-open nav.main-nav,
  body.nav-open .auth-group {
    display: flex;
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    background: var(--pitch-dark);
    flex-direction: column;
    padding: 24px 28px;
    border-bottom: 1px solid var(--pitch-line);
  }

  body.nav-open .auth-group { top: calc(72px + 120px); flex-direction: row; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }

  .tag.live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ball-red-bright);
    margin-bottom: 16px;
  }

  .tag .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ball-red-bright);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .scoreboard {
    background: var(--pitch-mid);
    border: 1px solid var(--pitch-line);
    border-radius: 4px;
    padding: 32px;
    text-align: center;
    margin-bottom: 24px;
  }

  .scoreboard .teams { font-size: 15px; color: var(--cream-dim); margin-bottom: 6px; }
  .scoreboard .digits { font-size: 72px; color: var(--gold); }
  .scoreboard .digits small { font-size: 30px; color: var(--cream-dim); }
  .scoreboard .overs { font-size: 15px; color: var(--cream-dim); margin-top: 4px; }

  .who-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 24px; }

  .who-card {
    flex: 1;
    background: var(--pitch-mid);
    border: 1px solid var(--pitch-line);
    border-radius: 4px;
    padding: 14px 16px;
  }

  .who-card label { display: block; font-size: 11px; color: var(--cream-dim); margin-bottom: 4px; }
  .who-card .value { font-size: 15px; }

  .this-over-label { font-size: 13px; color: var(--cream-dim); margin-bottom: 10px; }

  .this-over { display: flex; gap: 8px; flex-wrap: wrap; min-height: 34px; }

  .ball-pill {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--pitch-mid);
    border: 1px solid var(--pitch-line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .ball-pill.wicket { background: var(--ball-red-bright); border-color: var(--ball-red-bright); }
  .ball-pill.boundary { background: var(--gold); border-color: var(--gold); color: var(--pitch-dark); }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--cream-dim);
  }

  .empty-state h1 { font-size: 40px; color: var(--cream); margin-bottom: 10px; }

  .empty-state a {
    display: inline-block;
    margin-top: 20px;
    color: var(--gold);
    text-decoration: none;
    font-size: 14px;
    border-bottom: 1px solid var(--pitch-line);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="header-inner">
    <a href="index.html" class="logo"><span class="dot"></span>Crease</a>
    <nav class="main-nav">
      <a href="index.html#home">Home</a>
      <a href="index.html#tournaments">Tournament</a>
      <a href="score.html">Score Match</a>
    </nav>
    <div class="auth-group">
      <button class="btn-ghost-nav">Log in</button>
      <button class="btn-solid-nav">Sign up</button>
    </div>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="document.body.classList.toggle('nav-open')">☰</button>
  </div>
</div>

<div class="wrap" id="content">
  <div class="empty-state" id="emptyState">
    <h1>No live match right now</h1>
    <p>When someone starts scoring a public match, it'll show up here.</p>
    <a href="index.html">Back to homepage</a>
  </div>

  <div id="liveView" style="display:none;">
    <div class="tag live"><span class="pulse"></span>Live · Hosted match</div>

    <div class="scoreboard">
      <div class="teams" id="teamsLabel">Team A vs Team B</div>
      <div class="digits" id="runsWickets">0<small>/0</small></div>
      <div class="overs" id="oversLabel">Overs 0.0 of 20</div>
    </div>

    <div class="who-row">
      <div class="who-card"><label>Striker</label><div class="value" id="strikerVal">—</div></div>
      <div class="who-card"><label>Non-striker</label><div class="value" id="nonStrikerVal">—</div></div>
      <div class="who-card"><label>Bowler</label><div class="value" id="bowlerVal">—</div></div>
    </div>

    <div class="this-over-label">This over</div>
    <div class="this-over" id="thisOver"></div>
  </div>
</div>

<script>
  function refresh() {
    const raw = localStorage.getItem('crease-active-match');
    const empty = document.getElementById('emptyState');
    const live = document.getElementById('liveView');

    if (!raw) { empty.style.display = 'block'; live.style.display = 'none'; return; }

    let m;
    try { m = JSON.parse(raw); } catch (e) { empty.style.display = 'block'; live.style.display = 'none'; return; }

    if (m.status !== 'live' || m.visibility !== 'public') {
      empty.style.display = 'block';
      live.style.display = 'none';
      return;
    }

    empty.style.display = 'none';
    live.style.display = 'block';

    document.getElementById('teamsLabel').textContent = m.teamA + ' vs ' + m.teamB;
    document.getElementById('runsWickets').innerHTML = m.runs + '<small>/' + m.wickets + '</small>';
    const overs = Math.floor(m.ballsBowled / 6) + '.' + (m.ballsBowled % 6);
    document.getElementById('oversLabel').textContent = 'Overs ' + overs + ' of ' + m.oversLimit;
    document.getElementById('strikerVal').textContent = m.striker;
    document.getElementById('nonStrikerVal').textContent = m.nonStriker;
    document.getElementById('bowlerVal').textContent = m.bowler;

    const wrap = document.getElementById('thisOver');
    wrap.innerHTML = '';
    (m.thisOver || []).forEach(b => {
      const pill = document.createElement('div');
      pill.className = 'ball-pill' + (b.wicket ? ' wicket' : (b.runs >= 4 ? ' boundary' : ''));
      pill.textContent = b.label;
      wrap.appendChild(pill);
    });
  }

  refresh();
  setInterval(refresh, 1500);
  window.addEventListener('storage', refresh);
</script>

</body>
</html>
